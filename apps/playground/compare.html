<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三种绘制方式 · Settlement</title>
<body><header><a href="/">← 城镇地图工坊</a><h1>同一座城，三种笔触</h1><p>共享地图、配色和视口。滚轮缩放，拖动联动；切换样本不会重新生成地图。</p>
<nav><label>地图样本<select id="sample"><option value="small">城堡小镇 · 6</option><option value="medium" selected>城墙小城 · 15</option><option value="large">无墙都会 · 40</option><option value="citadel">城堡都会 · 40</option><option value="dense">密集街巷 · 40</option><option value="village">无广场村落 · 6</option></select></label><label>图纸<select id="theme"><option value="parchment">旧羊皮纸</option><option value="blueprint">建筑蓝图</option><option value="monochrome">黑白</option></select></label><label>缩放<select id="scale"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="4">4×</option><option value="8">8×</option></select></label><label>细节镜头<select id="detail"><option value="whole">整座城</option><option value="buildings">建筑与街巷</option><option value="roads">道路接合</option><option value="towers">城门与塔楼</option></select></label><button id="reset">复位视口</button><button id="difference" aria-pressed="false">显示边缘差异</button><span id="details"></span></nav><p id="difference-note" hidden>左侧为 OpenFL 原图；右侧仅标出与它不同的像素，颜色越深差异越大（8 倍增强）。白色表示相同。抗锯齿不同也会着色，并不表示地图几何不同。</p></header>
<main><article data-kind="openfl"><h2>OpenFL <small>WebGL2</small><button>导出 PNG</button></h2><div id="openfl" class="host"></div><output></output></article><article data-kind="canvas"><h2>Canvas <small>2D</small><button>导出 PNG</button></h2><div id="canvas" class="host"></div><output></output></article><article data-kind="svg"><h2>SVG <small>矢量</small><button>导出 SVG</button></h2><div id="svg" class="host"></div><output></output></article></main>
<footer>三者共用几何命中检测。图像只导出地图；页面文字使用相同字体，不计入地图绘制耗时。已选定 Canvas 默认预览、SVG 矢量导出，OpenFL 保留对照。</footer><script type="module" src="/src/compare.ts"></script></body></html>
