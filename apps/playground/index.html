<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settlement · 城镇地图工坊</title></head>
<body>
  <aside class="sidebar">
    <header><span class="eyebrow">THE CARTOGRAPHER'S WORKSHOP</span><h1>城镇地图工坊<span>Settlement</span></h1><p>从一粒种子，描绘一座城。</p></header>
    <form id="generator"><fieldset id="parameters">
      <div class="section-title"><span>01 / 生成城镇</span><span class="dot"></span></div>
      <label for="seed">地图种子</label><div class="seed-row"><input id="seed" name="seed" type="number" min="1" max="2147483646" step="1" required value="12345"><button type="button" id="random" class="icon-button" title="随机种子" aria-label="随机种子">↻</button></div>
      <label for="size">城镇规模</label><select id="size" name="size"><option value="6">小镇 · 6</option><option value="10">大镇 · 10</option><option value="15">小城 · 15</option><option value="24" selected>大城 · 24</option><option value="40">都会 · 40</option></select>
      <div class="features"><label>广场<select id="plaza"><option value="auto">自动</option><option value="true">有</option><option value="false">无</option></select></label><label>城堡<select id="castle"><option value="auto">自动</option><option value="true">有</option><option value="false">无</option></select></label><label>城墙<select id="walls"><option value="auto">自动</option><option value="true">有</option><option value="false">无</option></select></label></div>
      <button id="generate" class="primary" type="submit">生成地图 <span>↗</span></button>
    </fieldset></form>
    <section><div class="section-title">02 / 地图档案</div><div class="file-actions"><button id="import" type="button">导入 JSON</button><button id="export" type="button" disabled>导出 JSON</button></div><input type="file" id="file" accept=".json,application/json" hidden><p class="note">保存地图，留待下一次探索。</p></section>
    <section class="summary"><div class="section-title">本次生成</div><div class="stats"><div><strong id="district-count">—</strong><span>城区地块</span></div><div><strong id="building-count">—</strong><span>建筑</span></div></div><p id="resolved">正在绘制地图…</p></section>
    <footer><span class="status-dot"></span><span id="status" role="status" aria-live="polite">准备就绪</span></footer>
  </aside>
  <main>
    <div class="topbar"><div><span class="eyebrow">TOWN ATLAS</span><h2 id="map-title">城镇图册 <span>№ 12345</span></h2></div><label class="theme-label">图纸<select id="theme"><option value="parchment">旧羊皮纸</option><option value="blueprint">建筑蓝图</option><option value="ancient">古地图</option><option value="colour">田园彩绘</option><option value="ink">墨色</option><option value="monochrome">黑白</option></select></label></div>
    <div class="map-shell">
      <div id="map" tabindex="0" role="img" aria-label="城镇地图。滚轮缩放，拖动平移，方向键移动，按 0 复位。"></div>
      <div class="compass" aria-hidden="true"><span>N</span><svg width="28" height="42" viewBox="0 0 28 42"><path d="M14 2L25 36L14 29L3 36Z" fill="none" stroke="currentColor"/><path d="M14 2V29L3 36Z" fill="currentColor"/></svg></div>
      <div id="tooltip" role="tooltip" hidden></div>
      <div class="map-caption"><canvas id="atlas-title" aria-label="Settlement map"></canvas><span>滚轮缩放 · 拖动平移 · 悬停探索街区</span></div>
      <div class="zoom-tools"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="放大">+</button><button id="fit" aria-label="适应城镇">⌖</button></div>
      <div id="error" role="alert" hidden></div>
    </div>
    <div class="bottom-bar"><span id="hover-label">将指针移入地图，查看街区用途</span><span>WATABOUTOWN / SETTLEMENT</span></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body></html>
